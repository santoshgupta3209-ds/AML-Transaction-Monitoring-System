<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifications</title><link rel="stylesheet" href="style.css"></head>
<body class="notification-page"><nav class="navbar customer-navbar"><a class="brand customer-brand" href="customer-dashboard.html"><img src="logo.png" alt="Finova Bank logo"><span>Finova Bank of India</span></a><div class="customer-nav-links"><a href="customer-dashboard.html">Overview</a><a href="transactions.html">Transactions</a><a class="customer-logout" href="#" onclick="logout()">Logout</a></div></nav>
<main class="notification-content"><header class="notification-header"><div><p class="customer-kicker">PERSONAL BANKING</p><h1>Notifications</h1><p>Stay up to date with your account activity and security.</p></div><div class="notification-count"><strong id="unreadCount">0</strong><span>unread</span></div></header>
<section class="notification-toolbar"><div><p class="customer-kicker">YOUR INBOX</p><h2>Recent updates</h2></div><div class="notification-filters"><button class="notification-filter active" data-filter="all">All</button><button class="notification-filter" data-filter="unread">Unread</button><button class="notification-filter" data-filter="read">Read</button></div></section>
<section id="notifications" class="notification-list"></section><p id="message" class="message"></p></main>
<script>
const notificationsElement=document.getElementById("notifications");
const message=document.getElementById("message");
const unreadCount=document.getElementById("unreadCount");
let notificationsData=[];
let currentFilter="all";
function formatDateTime(value){if(!value)return "-";const date=new Date(value);if(Number.isNaN(date.getTime()))return "-";return new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true}).format(date)}
function renderNotifications(){const visible=notificationsData.filter(notification=>currentFilter==="all"||(currentFilter==="unread"&&!notification.is_read)||(currentFilter==="read"&&notification.is_read));notificationsElement.innerHTML=visible.map(notification=>`<article class="notification-item ${notification.is_read?"read":"unread"}" tabindex="0" onclick="openNotification(${notification.id})" onkeydown="if(event.key==='Enter'||event.key===' ')openNotification(${notification.id})"><div class="notification-icon">${notification.is_read?"i":"!"}</div><div class="notification-body"><div class="notification-item-top"><span class="notification-status">${notification.is_read?"READ":"NEW"}</span><time>${formatDateTime(notification.created_at)}</time></div><h3>${notification.title}</h3><p>${notification.message}</p>${notification.is_read?"":`<button class="notification-read-button" onclick="event.stopPropagation();readNotification(${notification.id})">Mark as read <span>&#8594;</span></button>`}</div></article>`).join("")||`<div class="notification-empty"><strong>${currentFilter==="all"?"No notifications yet":"No "+currentFilter+" notifications"}</strong><span>Your account updates will appear here.</span></div>`}
function openNotification(id){const notification=notificationsData.find(item=>item.id===id);if(notification&&!notification.is_read)readNotification(id)}
async function load(){const customerId=localStorage.getItem("customer_id");if(!customerId){message.textContent="Customer ID not found. Open the customer dashboard first.";return}try{const response=await fetch(`/notifications/customer/${encodeURIComponent(customerId)}`);const data=await response.json();if(!response.ok)throw Error(data.detail||"Unable to load notifications");notificationsData=data.notifications||[];unreadCount.textContent=notificationsData.filter(notification=>!notification.is_read).length;renderNotifications()}catch(error){message.textContent=error.message}}
async function readNotification(id){const response=await fetch(`/notifications/${id}/read`,{method:"PUT"});if(response.ok)load();else message.textContent="Unable to update notification"}
function logout(){localStorage.clear();location.href="login.html"}
document.querySelectorAll(".notification-filter").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".notification-filter").forEach(item=>item.classList.remove("active"));button.classList.add("active");currentFilter=button.dataset.filter;renderNotifications()}));
load();
</script></body></html>
