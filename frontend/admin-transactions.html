<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Transaction Monitor</title><link rel="stylesheet" href="style.css"></head>
<body><nav class="navbar"><div class="brand"><span>Finova Bank </span></div><div><a href="admin-dashboard.html">Dashboard</a><a href="alerts.html">Alerts</a><a href="#" onclick="logout()">Logout</a></div></nav>
<main class="container"><h1>All Transactions</h1><p>Read-only transaction monitoring for administrators.</p><div class="table-wrap"><table class="wide-table"><thead><tr><th>ID</th><th>Debit Customer</th><th>Debit Account</th><th>Amount</th><th>Credit Customer</th><th>Credit Account</th><th>Type</th><th>Channel</th><th>Location</th><th>Risk Score</th><th>Risk Level</th><th>Status</th><th>Date & Time</th></tr></thead><tbody id="rows"></tbody></table></div><p id="message" class="message"></p></main>
<script>
if(localStorage.getItem("role") !== "ADMIN"){window.location.href="login.html"}
function formatDateTime(value){if(!value)return "-";const date=new Date(value);if(Number.isNaN(date.getTime()))return "-";return new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true}).format(date)}
async function load(){try{const response=await fetch("/admin/transactions"),data=await response.json();if(!response.ok)throw Error(data.detail||"Unable to load transactions");rows.innerHTML=data.map(transaction=>`<tr><td>#${transaction.id}</td><td>${transaction.debit?.customer_name||"-"}</td><td>${transaction.debit?.account_number||"-"}</td><td>₹ ${Number(transaction.amount).toLocaleString("en-IN")}</td><td>${transaction.credit?.customer_name||"-"}</td><td>${transaction.credit?.account_number||"-"}</td><td>${transaction.transaction_type||"-"}</td><td>${transaction.transaction_channel||"-"}</td><td>${transaction.transaction_location||"-"}</td><td>${transaction.risk_probability == null ? "-" : Number(transaction.risk_probability).toFixed(3)}</td><td><b>${transaction.risk_level||"-"}</b></td><td>${transaction.status||"-"}</td><td>${formatDateTime(transaction.created_at)}</td></tr>`).join("")||"<tr><td colspan='13'>No transactions found.</td></tr>"}catch(error){message.textContent=error.message}}
function logout(){localStorage.clear();location.href="login.html"}load();
</script></body></html>
