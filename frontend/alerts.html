<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AML Alerts</title><link rel="stylesheet" href="style.css"></head>
<body><nav class="navbar"><div class="brand"><span>Finova Bank of India</span></div><a href="admin-dashboard.html">Dashboard</a></nav>
<main class="container"><h1>Suspicious Activity Alerts</h1><div class="table-wrap"><table class="wide-table"><thead><tr><th>ID</th><th>Transaction</th><th>Debit Customer</th><th>Debit Account</th><th>Credit Customer</th><th>Credit Account</th><th>Risk Score</th><th>Risk Level</th><th>Type</th><th>Status</th><th>Action</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div><section id="alertDetails" class="card hidden"></section><p id="message" class="message"></p></main>
<script>
function formatDateTime(value){if(!value)return "-";const date=new Date(value);if(Number.isNaN(date.getTime()))return "-";return new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true}).format(date)}
async function load(){try{const r=await fetch("/admin/alerts"),d=await r.json();if(!r.ok)throw Error(d.detail||"Unable to load");
rows.innerHTML=d.map(a=>`<tr onclick='showAlert(${JSON.stringify(a)})' style="cursor:pointer"><td>${a.id}</td><td>${a.transaction_id}</td><td>${a.debit?.customer_name||a.customer?.name||"-"}</td><td>${a.debit?.account_number||"-"}</td><td>${a.credit?.customer_name||"-"}</td><td>${a.credit?.account_number||"-"}</td><td>${Number(a.risk_score).toFixed(3)}</td><td><b>${a.risk_level}</b></td><td>${a.alert_type||"-"}</td><td>${a.status}</td><td>${a.status === "OPEN" ? `<button class="small-btn danger" onclick="event.stopPropagation(); closeAlert(${a.id})">Close</button>` : "-"}</td><td>${formatDateTime(a.created_at)}</td></tr>`).join("")||"<tr><td colspan='12'>No alerts found.</td></tr>";
}catch(e){message.textContent=e.message}}load();
function showAlert(alert){const customer=alert.customer||{};const debit=alert.debit||{};const credit=alert.credit||{};alertDetails.classList.remove("hidden");alertDetails.innerHTML=`<h2>Alert Details</h2><p><strong>Debited From:</strong> ${debit.customer_name||customer.name||"-"} - Account ${debit.account_number||customer.account_number||"-"}</p><p><strong>Credited To:</strong> ${credit.customer_name||"-"} - Account ${credit.account_number||"-"}</p><p><strong>Sender Phone:</strong> ${customer.phone||"-"}</p><p><strong>Transaction:</strong> #${alert.transaction_id}</p><p><strong>Risk:</strong> ${alert.risk_level} (${Number(alert.risk_score).toFixed(3)})</p><p><strong>Status:</strong> ${alert.status}</p><p>${alert.description||"-"}</p>`}
async function closeAlert(alertId){try{const r=await fetch(`/admin/alerts/${alertId}/close`,{method:"PUT"}),d=await r.json();if(!r.ok)throw Error(d.detail||"Unable to close alert");message.textContent=d.message;await load()}catch(e){message.textContent=e.message}}
</script></body></html>
